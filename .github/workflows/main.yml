
name: Build Jenga Football Automation-Ready APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract source ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Jenga-Football-V3.0-Automation-Ready-Source*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found in repository root."
            exit 1
          fi
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source
          test -f build-source/package.json
          test -f build-source/capacitor.config.json
          test -f build-source/www/index.html

      - name: Install dependencies
        working-directory: build-source
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: build-source
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: build-source
        run: npx cap sync android

      - name: Build APK
        working-directory: build-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jenga-Football-V3.0-Automation-Ready-APK
          path: build-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
