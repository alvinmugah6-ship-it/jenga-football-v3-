name: Build Jenga Football Automation-Ready APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract and locate project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Jenga-Football-V3.0-Automation-Ready-Source*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found."
            exit 1
          fi

          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

          PROJECT_DIR="$(find build-source -type f -path '*/www/index.html' -print -quit | sed 's#/www/index.html$##')"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ] || [ ! -f "$PROJECT_DIR/capacitor.config.json" ]; then
            echo "Project files could not be located."
            find build-source -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jenga-Football-V3.0-Automation-Ready-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
